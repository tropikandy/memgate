# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# WP-002/WP-005 scratch config: listening on 127.0.0.1:8801 (IF-1), memgate
# macro still empty (memgate joins at WP-006). All values below are filled
# from real captures (docs/baseline/mtplx-argv.txt for the 4B, WP-001;
# docs/baseline/27b-argv.txt for the 27B, WP-005) -- no «VERIFY» markers
# remain in this file. Port 8000 / the live MTPLX-4B LaunchAgent are
# untouched throughout WP-002/WP-005 (C1 scope-out): this file proves the
# mechanism on a scratch port only, cutover to 8000 is WP-007.
#
# Run: llama-swap -config config/llama-swap.yaml -listen 127.0.0.1:8801

# Generous: covers a cold 27B load from external SSD (N2). Minimum accepted is 15.
healthCheckTimeout: 300

# Internal backend ports allocated from here upward by ${PORT}. Confirmed
# free in the WP-001 lsof capture (docs/baseline/listening-ports.txt).
startPort: 9200

logLevel: info

macros:
  # Quoted at every use site below ("${mtplx_python}") -- this path contains
  # a space ("Application Support") and llama-swap's cmd field splits on
  # whitespace, so an unquoted reference fails to exec (found during WP-002).
  mtplx_python: "/Users/andreaslarsson/Library/Application Support/MTPLX/runtime-venv/bin/python"
  mtplx_module: "mtplx.server.openai"
  # WP-006: memgate wired in, per-tier floors (not one shared value --
  # requiring 27B-level headroom just to load the 4B was a real
  # miscalibration found during this WP, see docs/wp006-results.md).
  # Each floor = that model's measured incremental footprint + a margin,
  # using "available" (which already nets out reclaimable/inactive file
  # cache) as the basis, not a naive "return to the pristine WP-001 idle
  # floor" -- that stricter bar isn't what memgate's --require-free-mb is
  # for. 4B: ~7.8GB measured (T-11, WP-006) + 2GB margin = 9856 -> 10240.
  # 27B: ~17.4GB measured (contaminated, WP-005) + 2GB margin = 19456 ->
  # 20480, revisit once WP-006's clean single-model 27B number lands.
  memgate_4b: "/Users/andreaslarsson/.local/bin/memgate --require-free-mb 10240 --timeout 180 --"
  memgate_27b: "/Users/andreaslarsson/.local/bin/memgate --require-free-mb 20480 --timeout 180 --"

models:

  # ---- fast tier ---------------------------------------------------------
  # Flags below are the real 4B steady-state argv, captured 2026-08-16 from
  # PID 64781 (com.local.mtplx-server), docs/baseline/mtplx-argv.txt.
  "mtplx-qwen35-4b-optimized-quality":
    cmd: >
      ${memgate_4b}
      "${mtplx_python}" -m ${mtplx_module}
      --model /Volumes/2tb/Models/mtplx/Youssofal--Qwen3.5-4B-MTPLX-Optimized-Quality
      --backend-id qwen3_next
      --host 127.0.0.1 --port ${PORT}
      --model-id mtplx-qwen35-4b-optimized-quality
      --profile sustained
      --generation-mode mtp
      --depth 3
      --context-window 131072
      --paged-kv-quantization q8
      --ssd-session-cache on
      --scheduler-mode serial
      --batching-preset latency
      --max-active-requests 1
      --reasoning-mode auto
      --preserve-thinking auto
      --agent-thinking-budget auto
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /v1/models
    ttl: 900          # 15 min. Fast tier is the common path, keep it warm longer.
    unloadTimeout: 30 # let --ssd-session-cache flush before force-kill (C5)
    # No other id string was found in ~/.hermes/config.yaml (the only
    # consumer config captured so far). Conductor's config was not
    # available to this session -- if it sends a different model string,
    # add it here before cutover (R5/T-13).

  # ---- escalation tier ----------------------------------------------------
  # Flags below are the real 27B argv, captured 2026-08-16 from a standalone
  # run on scratch port 18027, docs/baseline/27b-argv.txt (WP-005). Only
  # --host/--port were changed (18027 -> ${PORT}); everything else verbatim,
  # per C5/the "copied verbatim, not tuned" constraint. Confirmed --generation-mode
  # mtp --depth 3 are both present: "bare" in Bare-Speed does not mean "no MTP".
  "mtplx-qwen38-27b-bare-speed":
    cmd: >
      ${memgate_27b}
      "${mtplx_python}" -m ${mtplx_module}
      --model /Volumes/2tb/Models/mtplx/Youssofal--Qwen3.8-27B-MTPLX-Bare-Speed
      --backend-id qwen3_next
      --host 127.0.0.1 --port ${PORT}
      --depth 3
      --generation-mode mtp
      --profile sustained
      --reasoning-mode auto
      --preserve-thinking auto
      --verify-strategy capture_commit
      --verify-core linear-gdn-from-conv-tape
      --draft-lm-head-bits 4
      --draft-lm-head-group-size 64
      --draft-lm-head-mode affine
      --rate-limit 0
      --stream-interval 1
      --scheduler-mode ar_batch
      --batching-preset agent
      --mtp-batch-numerics throughput
      --warmup-tokens 16
      --model-id mtplx-qwen38-27b-bare-speed
      --paged-kv-quantization off
      --fan-mode default
      --max-active-requests 1
      --decode-batch-max 2
      --batch-wait-ms 50.0
      --prefill-chunk-tokens 2048
      --retrieval-max-resident 2
      --context-window 131072
      --experimental-mtp-cohorts
      --ssd-session-cache on
      --ssd-session-cache-max-size auto
      --ssd-session-cache-min-prefix-tokens 512
      --adaptive-policy expected_value
      --adaptive-min-depth 1
      --adaptive-ev-base-depth 2
      --adaptive-ev-accept-priors 0.92,0.64,0.32
      --adaptive-ev-draft-cost-s 0.0048
      --adaptive-ev-extra-verify-cost-s 0.006
      --adaptive-ev-baseline-tok-s 40.0
      --adaptive-ev-safety-margin 0.1
      --adaptive-ev-margin-center 1.0
      --adaptive-ev-margin-scale 2.0
      --adaptive-ev-confidence-weight 0.35
      --adaptive-ev-min-extra-accept-probability 0.18
      --adaptive-ev-warmup-full-depth-cycles 4
      --adaptive-ev-exploration-interval 32
      --draft-temperature 0.6
      --draft-top-p 0.95
      --draft-top-k 20
      --tool-prompt-mode hybrid
      --chat-template-profile local_qwen36
      --temperature 1.0
      --top-p 0.95
      --top-k 20
      --reasoning-parser qwen3
      --reasoning-effort medium
      --no-stats-footer
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /v1/models
    ttl: 300          # shorter than the 4B: this is the memory hog, return to safe state sooner
    unloadTimeout: 45 # larger model, more teardown -- let --ssd-session-cache flush (C5)

groups:
  # Redundant with llama-swap's default one-at-a-time behaviour, but stated
  # explicitly: this line is the machine-readable form of R4, and the reason
  # the 2026-08-04 panic shape cannot recur.
  mtplx-exclusive:
    swap: true
    exclusive: true
    members:
      - "mtplx-qwen35-4b-optimized-quality"
      - "mtplx-qwen38-27b-bare-speed"

# memgate joins at WP-006 (macro above goes from "" to the WP-003 binary
# with --require-free-mb set from docs/baseline/n3-ceiling-derivation.md),
# and the production MTPLX-4B LaunchAgent must be stopped before that WP's
# tests run -- see docs/wp002-wp004-results.md for why (a real, measured
# false-overlap effect otherwise).
